<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure PDF Viewer</title>
  <link rel="stylesheet" href="pdfjs/web/viewer.css">
  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
    /* Additional styles to hide download and print buttons */
    .download, .print {
      display: none;
    }
  </style>
</head>
<body>
  <div id="viewerContainer" class="pdfViewer"></div>
  <script src="pdfjs/build/pdf.js"></script>
  <script src="pdfjs/web/viewer.js"></script>
  <script>
    // Parse URL to get the file parameter
    const urlParams = new URLSearchParams(window.location.search);
    const fileURL = urlParams.get('file');

    // Initialize PDF.js
    const loadingTask = pdfjsLib.getDocument(fileURL);
    loadingTask.promise.then(pdf => {
      // Fetch the first page
      pdf.getPage(1).then(page => {
        const scale = 1.5;
        const viewport = page.getViewport({ scale });

        // Prepare canvas using PDF page dimensions
        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        // Append canvas to the viewer
        document.getElementById('viewerContainer').appendChild(canvas);

        // Render PDF page into canvas context
        const renderContext = {
          canvasContext: context,
          viewport
        };
        page.render(renderContext);
      });
    });
  </script>
</body>
</html>
